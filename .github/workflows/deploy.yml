name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_APP_URL: https://urbanground.salmanagha.dev

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Navigate to the subdomain folder
            cd /var/www/salmanagha.dev
            mkdir -p urbanground
            cd urbanground
            
            # Pull latest changes (assuming the repo is already cloned there)
            if [ ! -d ".git" ]; then
              git clone git@github.com:SalmanAgha/Ai-Voice-Task-Maker.git .
            else
              git pull origin main
            fi
            
            # Install and setup
            npm install
            npx prisma generate
            npx prisma db push
            
            # Build
            npm run build
            
            # Restart/Start PM2 process
            pm2 restart vortex-ai || pm2 start npm --name "vortex-ai" -- start -- -p 3000
